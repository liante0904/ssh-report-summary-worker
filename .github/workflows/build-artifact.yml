name: Build Worker Artifact

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          bash scripts/verify_ci.sh

      - name: Build source artifact
        run: |
          mkdir -p dist
          tar --exclude='./.git' --exclude='./.pytest_cache' --exclude='__pycache__' \
            -czf "dist/ssh-report-summary-worker-${GITHUB_SHA}.tar.gz" .

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ssh-report-summary-worker-${{ github.sha }}
          path: dist/*.tar.gz
          if-no-files-found: error
