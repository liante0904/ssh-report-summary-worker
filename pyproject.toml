[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-report-summary-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
ssh-report-summary-worker = "ssh_report_summary_worker.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
